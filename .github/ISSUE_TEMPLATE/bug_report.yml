name: Bug report
description: Report a bug in Luna (do not paste personal data)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste cookies, tokens, uids, phone numbers, message content or screenshots that contain personal information.** Report security vulnerabilities privately, as described in `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: env
    attributes:
      label: Windows and .NET SDK
  - type: textarea
    id: logs
    attributes:
      label: Log or output (with all personal data removed)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: I removed all cookies, tokens, uids, phone numbers and message content from this report.
          required: true
