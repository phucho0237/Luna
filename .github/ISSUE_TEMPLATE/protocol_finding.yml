name: Protocol finding
description: Share an observation about the shape or behavior of the protocol (field names and types only, no values)
title: "[Protocol] "
labels: ["protocol"]
body:
  - type: markdown
    attributes:
      value: |
        Share only the **shape** (field names and types), obtained with `Luna.Playground --shape`. **Do not** paste values, uids, cookies or message content.
  - type: input
    id: where
    attributes:
      label: Related command, event or endpoint
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Observed shape
      render: text
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Level of evidence
      options:
        - "[Live] seen on the live server with a secondary account"
        - "[Source] only read from open source code"
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: What did you do to see this?
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: The content above contains no cookies, tokens, uids, phone numbers or message content.
          required: true
