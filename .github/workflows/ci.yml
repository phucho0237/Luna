name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Language tooling self-tests
        shell: pwsh
        run: |
          ./scripts/check-language.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Language check
        shell: pwsh
        run: ./scripts/check-language.ps1
      - name: Language check (commit messages)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        shell: pwsh
        run: ./scripts/check-language.ps1 -Commits "${{ github.event.pull_request.base.sha }}..HEAD"
      - name: Test Luna.Protocol
        run: dotnet test ./Luna.Protocol.Tests/Luna.Protocol.Tests.csproj --nologo
      - name: Test Luna.Core
        run: dotnet test ./Luna.Core.Tests/Luna.Core.Tests.csproj --nologo
      - name: Build Playground
        run: dotnet build ./Luna.Playground/Luna.Playground.csproj --nologo
